<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>uncooked — hero wireframe</title>

<!-- Satoshi (Fontshare) — needs an internet connection; falls back to system sans -->
<link rel="preconnect" href="https://api.fontshare.com" crossorigin />
<link rel="stylesheet" href="https://api.fontshare.com/v2/css?f%5B%5D=satoshi@400,500,700,900&display=swap" />

<style>
  /* ============================================================
     uncooked — mid-fi hero wireframe
     greyscale only. focus = structure + copy, not colour.
     ============================================================ */

  :root {
    --ink:        #1a1a1a;   /* headline / primary surfaces */
    --ink-2:      #4a4a4a;   /* body copy */
    --ink-3:      #8a8a8a;   /* muted / inactive nav */
    --line:       #d8d8d8;   /* borders */
    --line-soft:  #e8e8e8;
    --surface:    #ffffff;
    --bg:         #f4f4f4;
    --bg-grid:    #ebebeb;
    --radius-pill: 999px;

    /* navbar geometry — slightly tighter than a true 1 : 2 : 1 */
    --nav-width: 46vw;
    --nav-top: 38px;
    --nav-h: 96px;           /* nav height + top offset, used to offset content */

    --sans: "Satoshi", "Helvetica Neue", Helvetica, Arial, sans-serif;
    --serif: "Times New Roman", Times, Georgia, serif;
  }

  * { box-sizing: border-box; }

  html { scroll-behavior: smooth; }

  body {
    margin: 0;
    padding-top: var(--nav-h);
    font-family: var(--sans);
    color: var(--ink-2);
    background-color: var(--bg);
    /* faint wireframe grid so it reads as a mock, not a finished page */
    background-image:
      linear-gradient(var(--bg-grid) 1px, transparent 1px),
      linear-gradient(90deg, var(--bg-grid) 1px, transparent 1px);
    background-size: 48px 48px;
    -webkit-font-smoothing: antialiased;
  }

  /* ---------- hero ---------- */

  .hero {
    min-height: calc(100svh - var(--nav-h));
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;   /* body of the page sits centred in the viewport */
    gap: 0;
    max-width: 820px;
    margin: 0 auto;
    padding: 48px 20px 72px;
    text-align: center;
  }

  .hero h1 {
    margin: 0;
    font-size: clamp(44px, 9vw, 92px);
    line-height: 1.02;
    letter-spacing: -.045em;
    font-weight: 700;
    color: var(--ink);
    text-wrap: balance;
  }

  .hero h1 em {
    font-family: var(--serif);
    font-style: italic;
    font-weight: 400;
    color: var(--ink-3);
    letter-spacing: -.02em;
  }

  .hero p {
    margin: 26px auto 0;
    max-width: 620px;
    font-size: clamp(15px, 2.1vw, 19px);
    line-height: 1.55;
    font-weight: 500;
    color: var(--ink-2);
    text-align: center;
    text-wrap: balance;        /* keeps the centred lines evenly broken */
  }

  .cta-row {
    margin-top: 40px;
    display: flex;
    justify-content: center;
    flex-wrap: wrap;
    gap: 12px;
  }

  .btn {
    font-family: inherit;
    font-size: 16px;
    font-weight: 700;
    padding: 15px 30px;
    border-radius: var(--radius-pill);
    cursor: pointer;
    transition: transform .15s ease, opacity .15s ease, background .15s ease;
  }
  .btn:active { transform: translateY(1px); }

  .btn-primary {
    background: var(--ink);
    color: var(--surface);
    border: 1px solid var(--ink);
  }
  .btn-primary:hover { opacity: .88; }

  .btn-secondary {
    background: transparent;
    color: var(--ink);
    border: 1px solid var(--line);
  }
  .btn-secondary:hover { background: var(--surface); border-color: var(--ink-3); }

  :focus-visible { outline: 2px solid var(--ink); outline-offset: 3px; }

  /* ---------- marquee (below the fold) ---------- */

  .marquee {
    --card-w: 240px;
    --card-h: 120px;
    --card-gap: 32px;
    --speed: 60s;              /* slow drift — raise to slow it further */

    padding: 72px 0 96px;
    overflow: hidden;
  }

  .marquee-label {
    margin: 0 0 32px;
    text-align: center;
    font-size: 14px;
    font-weight: 500;
    color: var(--ink-3);
  }

  /* viewport — fades the rectangles out at both edges */
  .marquee-window {
    overflow: hidden;
    -webkit-mask-image: linear-gradient(90deg, transparent, #000 10%, #000 90%, transparent);
            mask-image: linear-gradient(90deg, transparent, #000 10%, #000 90%, transparent);
  }

  /* track holds two identical runs of cards, so -50% loops seamlessly */
  .marquee-track {
    display: flex;
    width: max-content;
    gap: var(--card-gap);
    animation: marquee-left var(--speed) linear infinite;
  }
  .marquee:hover .marquee-track { animation-play-state: paused; }

  @keyframes marquee-left {
    from { transform: translateX(0); }
    to   { transform: translateX(calc(-50% - var(--card-gap) / 2)); }
  }

  .marquee-card {
    flex: none;
    width: var(--card-w);
    height: var(--card-h);
    border-radius: 12px;
    background: #dcdcdc;
    border: 1px solid var(--line);
  }

  @media (prefers-reduced-motion: reduce) {
    .marquee-track { animation: none; }
  }

  /* ---------- sticky qr card (bottom right) ---------- */

  .qr-card {
    position: fixed;
    right: 24px;
    bottom: 24px;
    z-index: 40;
    display: flex;
    align-items: center;
    gap: 16px;
    padding: 16px 18px;
    background: var(--surface);
    border: 1px solid var(--line);
    border-radius: 16px;
    box-shadow: 0 2px 4px rgba(0,0,0,.04), 0 12px 32px rgba(0,0,0,.10);
    transition: transform .28s cubic-bezier(.4,0,.2,1), opacity .2s ease;
  }
  /* dismissed — slides off the corner and stops catching clicks */
  .qr-card[hidden] {
    display: flex;
    transform: translate(12px, 140%);
    opacity: 0;
    pointer-events: none;
  }

  .qr-card-text {
    max-width: 120px;
    margin: 0;
    font-size: 15px;
    font-weight: 700;
    line-height: 1.25;
    letter-spacing: -.01em;
    color: var(--ink);
  }

  /* fake qr — a grid of modules drawn by script, purely decorative */
  .qr-code {
    width: 76px;
    height: 76px;
    flex: none;
    display: grid;
    grid-template: repeat(21, 1fr) / repeat(21, 1fr);
    padding: 4px;
    background: var(--surface);
    border: 1px solid var(--line-soft);
    border-radius: 6px;
  }
  .qr-code i { background: var(--ink); }

  .qr-close {
    position: absolute;
    top: -9px;
    right: -9px;
    width: 24px;
    height: 24px;
    display: grid;
    place-items: center;
    padding: 0;
    font-family: inherit;
    font-size: 14px;
    line-height: 1;
    color: var(--ink);
    background: var(--surface);
    border: 1px solid var(--line);
    border-radius: 999px;
    cursor: pointer;
    transition: background .15s ease, color .15s ease;
  }
  .qr-close:hover { background: var(--ink); color: var(--surface); }

  /* collapsed state — small launcher that brings the card back */
  .qr-reopen {
    position: fixed;
    right: 24px;
    bottom: 24px;
    z-index: 40;
    display: grid;
    place-items: center;
    width: 46px;
    height: 46px;
    padding: 0;
    background: var(--surface);
    border: 1px solid var(--line);
    border-radius: 999px;
    box-shadow: 0 2px 4px rgba(0,0,0,.04), 0 10px 24px rgba(0,0,0,.10);
    cursor: pointer;
    transition: transform .28s cubic-bezier(.4,0,.2,1), opacity .2s ease;
  }
  .qr-reopen[hidden] {
    display: grid;
    transform: scale(.6);
    opacity: 0;
    pointer-events: none;
  }
  .qr-reopen:hover { transform: translateY(-2px); }
  .qr-reopen .qr-code {
    width: 24px; height: 24px;
    padding: 0; border: 0; border-radius: 0;
  }

  /* ---------- mobile ---------- */

  @media (max-width: 1100px) {
    /* 1:2:1 is unusable below desktop — nav falls back to near-full width */
    :root { --nav-width: calc(100% - 32px); }
  }

  @media (max-width: 720px) {
    :root { --nav-top: 20px; --nav-h: 78px; }
    .hero { padding: 32px 16px 56px; }
    .btn { width: 100%; max-width: 320px; }
    .marquee { --card-w: 170px; --card-h: 90px; --card-gap: 20px; padding: 48px 0 64px; }
    .qr-card { right: 16px; bottom: 16px; gap: 12px; padding: 12px 14px; }
    .qr-card-text { font-size: 14px; max-width: 100px; }
    .qr-code { width: 60px; height: 60px; }
    .qr-reopen { right: 16px; bottom: 16px; }
  }
</style>
</head>
<body>

  <!-- navbar component — see <uncooked-nav> definition at the foot of this file -->
  <uncooked-nav active="jobs"></uncooked-nav>

  <!-- ===== hero ===== -->
  <main class="hero">
    <h1>never get ghosted</h1>
    <p>
      no CVs. no cover letters. no repeating yourself 140 times.
      apply from your phone. a guaranteed answer in 7 days on every partner role through us.
    </p>
    <div class="cta-row">
      <button class="btn btn-primary" type="button">get seen</button>
      <button class="btn btn-secondary" type="button">see tracker</button>
    </div>
  </main>

  <!-- ===== logo marquee — placeholder blocks, drifting left ===== -->
  <section class="marquee" aria-label="students and grads from">
    <p class="marquee-label">students and grads from</p>
    <div class="marquee-window">
      <div class="marquee-track" id="marquee-track" aria-hidden="true"></div>
    </div>
  </section>

  <!-- ===== sticky qr card ===== -->
  <aside class="qr-card" id="qr-card">
    <p class="qr-card-text">see what's cooking</p>
    <div class="qr-code" data-qr aria-hidden="true"></div>
    <button class="qr-close" id="qr-close" type="button" aria-label="hide card">&times;</button>
  </aside>

  <button class="qr-reopen" id="qr-reopen" type="button" aria-label="show the qr card" hidden>
    <span class="qr-code" data-qr aria-hidden="true"></span>
  </button>

<script>
/* ---- fake qr: deterministic module grid + three finder squares ---- */
(() => {
  const N = 21;
  let seed = 20261122;
  const rand = () => (seed = (seed * 1103515245 + 12345) & 0x7fffffff) / 0x7fffffff;

  /* finder squares: 7x7 ring with a 3x3 core, in three corners */
  const inFinder = (r, c) => [[0,0],[0,N-7],[N-7,0]].some(([fr, fc]) => {
    const y = r - fr, x = c - fc;
    if (y < 0 || x < 0 || y > 6 || x > 6) return false;
    const ring = y === 0 || y === 6 || x === 0 || x === 6;
    const core = y >= 2 && y <= 4 && x >= 2 && x <= 4;
    return ring || core;
  });
  const nearFinder = (r, c) => [[0,0],[0,N-7],[N-7,0]]
    .some(([fr, fc]) => r >= fr - 1 && r <= fr + 7 && c >= fc - 1 && c <= fc + 7);

  const cells = [];
  for (let r = 0; r < N; r++) {
    for (let c = 0; c < N; c++) {
      cells.push(inFinder(r, c) || (!nearFinder(r, c) && rand() > .5));
    }
  }

  document.querySelectorAll('[data-qr]').forEach(host => {
    const frag = document.createDocumentFragment();
    cells.forEach(on => {
      const i = document.createElement('i');
      if (!on) i.style.background = 'transparent';
      frag.appendChild(i);
    });
    host.appendChild(frag);
  });
})();

/* ---- show / hide the card ---- */
(() => {
  const card = document.getElementById('qr-card');
  const reopen = document.getElementById('qr-reopen');
  const toggle = open => { card.hidden = !open; reopen.hidden = open; };
  document.getElementById('qr-close').addEventListener('click', () => toggle(false));
  reopen.addEventListener('click', () => toggle(true));
})();

/* marquee: build one run of cards, then clone it so the -50% loop is seamless */
(() => {
  const CARDS = 6;
  const track = document.getElementById('marquee-track');
  const run = document.createDocumentFragment();
  for (let i = 0; i < CARDS; i++) {
    const card = document.createElement('div');
    card.className = 'marquee-card';
    run.appendChild(card);
  }
  track.appendChild(run);
  track.append(...[...track.children].map(c => c.cloneNode(true)));
})();
</script>

<script>
/* ============================================================
   <uncooked-nav>  — self-contained, fixed-position navbar
   attributes:  active="jobs|tracker|events|labs"
   styles are scoped in shadow DOM; it reads --nav-width, --nav-top,
   --ink, --line etc. from :root so the wireframe tokens still apply.
   ============================================================ */
class UncookedNav extends HTMLElement {
  static LINKS = ['jobs', 'tracker', 'events', 'labs'];

  constructor() {
    super();
    this.attachShadow({ mode: 'open' });
  }

  connectedCallback() { this.render(); }

  static get observedAttributes() { return ['active']; }
  attributeChangedCallback() { if (this.shadowRoot.childElementCount) this.render(); }

  render() {
    const active = this.getAttribute('active') || 'jobs';

    this.shadowRoot.innerHTML = `
      <style>
        :host {
          position: fixed;
          top: 0; left: 0; right: 0;
          z-index: 50;
          display: block;
          padding: var(--nav-top, 18px) 0 0;
          font-family: inherit;
          pointer-events: none;          /* only the pill itself is clickable */
        }

        .nav {
          pointer-events: auto;
          width: var(--nav-width, 46vw);
          margin: 0 auto;
          display: flex;
          align-items: center;
          gap: 12px;
          padding: 8px 8px 8px 16px;
          background: var(--surface, #fff);
          border: 1px solid var(--line, #d8d8d8);
          border-radius: var(--radius-pill, 999px);
          box-shadow: 0 1px 2px rgba(0,0,0,.04), 0 8px 24px rgba(0,0,0,.05);
        }

        .brand {
          display: flex; align-items: center; gap: 8px;
          text-decoration: none; color: var(--ink, #1a1a1a);
          flex: none;
        }
        .brand-mark {
          width: 24px; height: 24px; flex: none;
          border-radius: 7px;
          background: var(--ink, #1a1a1a);
          display: grid; place-items: center;
        }
        .brand-mark i {
          width: 8px; height: 8px; display: block;
          border: 2px solid var(--surface, #fff);
          border-radius: 3px 3px 3px 0;
        }
        .brand-name {
          font-size: 16px; font-weight: 700; letter-spacing: -.02em;
        }

        .badge {
          flex: none;
          font-size: 9px; font-weight: 700;
          letter-spacing: .08em; text-transform: uppercase;
          color: var(--ink, #1a1a1a);
          border: 1px solid var(--line, #d8d8d8);
          border-radius: 999px;
          padding: 3px 6px;
        }

        .divider {
          width: 1px; align-self: stretch; flex: none;
          margin: 2px 2px;
          background: var(--line-soft, #e8e8e8);
        }

        ul {
          display: flex; align-items: center; gap: 10px;
          margin: 0 auto; padding: 0; list-style: none;
        }

        a.link {
          display: inline-block;
          padding: 6px 10px;
          border-radius: 999px;
          font-size: 18px;
          font-weight: 500;
          color: var(--ink-3, #8a8a8a);
          text-decoration: none;
          white-space: nowrap;
          transition: color .15s ease, background .15s ease;
        }
        a.link:hover { color: var(--ink, #1a1a1a); background: var(--bg, #f4f4f4); }
        a.link[aria-current="page"] { color: var(--ink, #1a1a1a); font-weight: 700; }

        button {
          flex: none;
          display: inline-flex; align-items: center; gap: 7px;
          padding: 9px 16px;
          border: 1px solid var(--ink, #1a1a1a);
          border-radius: 999px;
          background: var(--ink, #1a1a1a);
          color: var(--surface, #fff);
          font-family: inherit; font-size: 14px; font-weight: 700;
          white-space: nowrap; cursor: pointer;
          transition: transform .15s ease, opacity .15s ease;
        }
        button:hover { opacity: .88; }
        button:active { transform: translateY(1px); }
        .arrow { transition: transform .15s ease; }
        button:hover .arrow { transform: translateX(3px); }

        :focus-visible { outline: 2px solid var(--ink, #1a1a1a); outline-offset: 3px; }

        @media (max-width: 720px) {
          .nav { padding: 7px 7px 7px 13px; gap: 8px; }
          .divider, ul { display: none; }   /* collapses to logo + cta */
          button { margin-left: auto; padding: 8px 13px; font-size: 13px; }
        }
      </style>

      <nav class="nav" aria-label="main">
        <a class="brand" href="#"><span class="brand-mark"><i></i></span><span class="brand-name">uncooked</span></a>
        <span class="badge">beta</span>
        <span class="divider"></span>
        <ul>
          ${UncookedNav.LINKS.map(l => `
            <li><a class="link" href="#${l}"${l === active ? ' aria-current="page"' : ''}>${l}</a></li>
          `).join('')}
        </ul>
        <button type="button">for startups <span class="arrow">&rarr;</span></button>
      </nav>
    `;

    /* clicking a nav link moves the active state (prototype behaviour) */
    this.shadowRoot.querySelectorAll('a.link').forEach(a => {
      a.addEventListener('click', e => {
        e.preventDefault();
        this.setAttribute('active', a.textContent.trim());
      });
    });
  }
}
customElements.define('uncooked-nav', UncookedNav);
</script>

</body>
</html>
